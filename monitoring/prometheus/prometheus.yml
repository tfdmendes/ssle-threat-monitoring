global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: example

alerting:
  alertmanagers: []

rule_files:
  - rules/availability.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: incus-nodes
    scheme: https
    metrics_path: /1.0/metrics
    tls_config:
      ca_file: /etc/prometheus/tls/incus/server.crt
      cert_file: /etc/prometheus/tls/incus/metrics.crt
      key_file: /etc/prometheus/tls/incus/metrics.key
      server_name: kali
    static_configs:
      - targets: ["10.255.255.1:8444"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: k3s-master|k3s-node1
        action: keep
      - source_labels: [name]
        target_label: node

  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    honor_timestamps: false
    authorization:
      credentials_file: /etc/prometheus/kubelet/token
    tls_config:
      ca_file: /etc/prometheus/kubelet/ca.crt
    static_configs:
      - targets: ["10.255.255.10:10250"]
        labels:
          node: k3s-master
      - targets: ["10.255.255.11:10250"]
        labels:
          node: k3s-node1
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_throttled_seconds_total|container_spec_cpu_quota|container_spec_cpu_period|container_memory_working_set_bytes
        action: keep
      - source_labels: [namespace]
        regex: .+
        action: keep
      # Exclude sandbox containers while retaining each Pod's own cgroup
      - source_labels: [container, image]
        regex: ;.+|POD;.*
        action: drop
      - source_labels: [container]
        regex: .+
        target_label: scope
        replacement: container
      - source_labels: [container]
        regex: ^$
        target_label: scope
        replacement: pod

  - job_name: ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["10.255.255.10:30501"]

  - job_name: health
    metrics_path: /metrics
    static_configs:
      - targets: ["10.255.255.10:30800"]
