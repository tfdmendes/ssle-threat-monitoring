global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: example

alerting:
  alertmanagers: []

rule_files:
  - rules/availability.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["10.255.255.10:30501"]

  - job_name: health
    metrics_path: /metrics
    static_configs:
      - targets: ["10.255.255.10:30800"]
