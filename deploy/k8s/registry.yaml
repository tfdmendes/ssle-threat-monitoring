apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: threat-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: threat-monitoring
spec:
  selector:
    app: registry
  ports:
    - port: 5050
      targetPort: 5050
