apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-registry
  template:
    metadata:
      labels:
        app: ssle-registry
    spec:
      containers:
        - name: registry
          image: ssle-registry:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-registry
spec:
  selector:
    app: ssle-registry
  ports:
    - port: 5050
      targetPort: 5050
