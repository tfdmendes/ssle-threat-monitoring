apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: threat-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: analytics:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5003
          env:
            - name: STORAGE_URL
              value: http://storage:5002
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: threat-monitoring
spec:
  selector:
    app: analytics
  ports:
    - name: http
      port: 5003
      targetPort: http
