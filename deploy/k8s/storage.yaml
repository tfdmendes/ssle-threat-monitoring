apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: threat-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
        - name: storage
          image: storage:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5002
          readinessProbe:
            httpGet:
              path: /stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: storage-data
              mountPath: /data
      volumes:
        - name: storage-data
          persistentVolumeClaim:
            claimName: storage-data
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: threat-monitoring
spec:
  selector:
    app: storage
  ports:
    - name: http
      port: 5002
      targetPort: http
