apiVersion: v1
kind: Service
metadata:
  name: ingestion-metrics
  namespace: threat-monitoring
spec:
  type: NodePort
  selector:
    app: ingestion
  ports:
    - name: http
      port: 5001
      targetPort: http
      nodePort: 30501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-exporter
  namespace: threat-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-exporter
  template:
    metadata:
      labels:
        app: health-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: health-exporter
          image: health-exporter:monitoring-63f3f8759e2e
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: health-exporter
  namespace: threat-monitoring
spec:
  type: NodePort
  selector:
    app: health-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
      nodePort: 30800
