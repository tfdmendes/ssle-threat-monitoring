apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: threat-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: ingestion:wazuh-f2a0194b4dd5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: SERVICE_URL
              value: http://ingestion:5001
            - name: REGISTRY_URL
              value: http://registry:5050
            - name: STORAGE_URL
              value: http://storage:5002
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: threat-monitoring
spec:
  selector:
    app: ingestion
  ports:
    - name: http
      port: 5001
      targetPort: http
