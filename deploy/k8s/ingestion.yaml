apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssle-ingestion
  namespace: ssle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssle-ingestion
  template:
    metadata:
      labels:
        app: ssle-ingestion
    spec:
      containers:
        - name: ingestion
          image: ssle-ingestion:monitoring-b5d2a91b32f8
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: SERVICE_URL
              value: http://ssle-ingestion:5001
            - name: REGISTRY_URL
              value: http://ssle-registry:5050
            - name: STORAGE_URL
              value: http://ssle-storage:5002
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ssle-ingestion
  namespace: ssle
spec:
  selector:
    app: ssle-ingestion
  ports:
    - name: http
      port: 5001
      targetPort: http
