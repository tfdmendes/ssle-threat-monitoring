apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: threat-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sensor
          image: sensor:sensor-auth
          imagePullPolicy: Never
          env:
            - name: DEVICE_ID
              value: sensor-k8s-001
            - name: INGESTION_URL
              value: https://ingestion:5001/ingest
            - name: INGESTION_CA_FILE
              value: /etc/ingestion-ca/ca.crt
          volumeMounts:
            - name: sensor-api-key
              mountPath: /run/secrets
              readOnly: true
            - name: ingestion-ca
              mountPath: /etc/ingestion-ca
              readOnly: true
      volumes:
        - name: sensor-api-key
          secret:
            secretName: sensor-api-key
            defaultMode: 0400
        - name: ingestion-ca
          configMap:
            name: ingestion-ca
