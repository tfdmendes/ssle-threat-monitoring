apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: threat-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sensor
  template:
    metadata:
      labels:
        app: sensor
    spec:
      containers:
        - name: sensor
          image: sensor:dev
          imagePullPolicy: Never
          env:
            - name: DEVICE_ID
              value: sensor-k8s-001
            - name: INGESTION_URL
              value: http://ingestion:5001/ingest
