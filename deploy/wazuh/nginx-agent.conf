<ossec_config>
  <localfile>
    <location>/var/log/containers/ingestion-*_threat-monitoring_nginx-*.log</location>
    <log_format>syslog</log_format>
    <!-- Keep the CRI header intact for the dedicated JSON decoder -->
    <out_format>nginx-ingestion: $(log)</out_format>
  </localfile>
</ossec_config>
