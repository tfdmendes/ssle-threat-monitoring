<ossec_config>
  <localfile>
  
    <!-- Collect ingestion container logs from namespace ssle -->

    <location>/var/log/containers/ssle-ingestion-*_ssle_ingestion-*.log</location>
    <log_format>syslog</log_format>

    <!-- Keep the CRI timestamp out of Wazuh's syslog pre-decoding
         The decoder uses this prefix to recognize the forwarded record -->

    <out_format>ssle-ingestion: $(log)</out_format>
  </localfile>
</ossec_config>
