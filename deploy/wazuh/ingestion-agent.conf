<ossec_config>
  <localfile>
  
    <!-- Collect ingestion container logs from namespace threat-monitoring -->

    <location>/var/log/containers/ingestion-*_threat-monitoring_ingestion-*.log</location>
    <log_format>syslog</log_format>

    <!-- Keep the CRI timestamp out of Wazuh's syslog pre-decoding
         The decoder uses this prefix to recognize the forwarded record -->

    <out_format>ingestion: $(log)</out_format>
  </localfile>
</ossec_config>
